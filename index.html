<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Aulas de Matemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--bg:#0E1B3D;--card:#1A2C5C;--line:#2E4580;--muted:#C9D3EC;--accent:#FFC93C;--wa:#128C4A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);color:#fff;font-family:'Archivo',system-ui,sans-serif;
background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px}
.wrap{max-width:920px;margin:0 auto;padding:40px 20px 56px}
.pill{display:inline-block;padding:7px 16px;border:2px solid var(--accent);border-radius:999px;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.14em}
h1{margin:14px 0 6px;font-size:clamp(40px,8vw,64px);line-height:.95;font-weight:900;letter-spacing:-.04em}
.bar{width:110px;height:9px;border-radius:5px;background:var(--accent);margin:14px 0 18px}
.sub{margin:0;color:var(--muted);font-size:17px;line-height:1.45;max-width:560px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:26px 0 18px;font-size:15px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:4px}
.dot.free{background:var(--accent)}.dot.busy{background:#3A4B78}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.day{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:10px}
.day.today{border-color:var(--accent)}
.dname{font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dname small{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.dsub{font-size:13px;color:var(--muted);margin-top:-6px}
.slot{display:flex;justify-content:space-between;align-items:center;min-height:46px;padding:10px 14px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none}
a.slot{background:var(--accent);color:#0E1B3D}
a.slot:hover,a.slot:focus-visible{background:#FFE08A;outline:none}
.slot.busy{background:#24365F;color:#8E9CC4;text-decoration:line-through}
.slot .tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-decoration:none}
.cta{margin-top:30px;display:flex;align-items:center;gap:18px;background:var(--wa);border-radius:22px;padding:18px 22px;color:#fff;text-decoration:none}
.cta .ic{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.cta b{display:block;font-size:24px;font-weight:900;letter-spacing:-.01em}
.cta span{font-size:14px;color:#E3F7EA;font-weight:600}
.note{margin-top:16px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
<span class="pill">AULAS PARTICULARES</span>
<h1>Agenda da semana</h1>
<div class="bar"></div>
<p class="sub">Matemática · reforço, preparatório para ETE e intensivo para recuperações e finais. Toque num horário livre para reservar pelo WhatsApp.</p>

<div class="legend"><span><i class="dot free"></i>Livre</span><span><i class="dot busy"></i>Ocupado</span></div>

<div class="days" id="days"></div>

<a class="cta" href="https://wa.me/5581982267438?text=Ol%C3%A1!%20Vi%20sua%20agenda%20e%20quero%20saber%20mais%20sobre%20as%20aulas%20de%20matem%C3%A1tica." target="_blank" rel="noopener">
<span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#128C4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></span>
<div><span>Dúvidas? Chame no WhatsApp</span><b>(81) 98226-7438</b></div>
</a>
<p class="note">Aulas de 1 hora, a domicílio. Horários sujeitos a confirmação.</p>
</main>

<script>
// Horários de reserva (usados se a plataforma estiver fora do ar)
var AGENDA = [
  {d:1, nome:'Segunda', sub:'18h às 21h', slots:[['18h',false],['19h',false],['20h',false]]},
  {d:2, nome:'Terça',   sub:'18h às 21h', slots:[['18h',true],['19h',false],['20h',false]]},
  {d:3, nome:'Quarta',  sub:'18h às 21h', slots:[['18h',true],['19h',false],['20h',false]]},
  {d:4, nome:'Quinta',  sub:'18h às 21h', slots:[['18h',false],['19h',false],['20h',false]]},
  {d:5, nome:'Sexta',   sub:'18h às 21h', slots:[['18h',true],['19h',false],['20h',false]]},
  {d:6, nome:'Sábado',  sub:'manhã · 8h às 12h', slots:[['8h',false],['9h',false],['10h',false],['11h',false]]}
];
function fim(h){var m=String(h).match(/(\d+)(?::(\d+))?/);var hh=+m[1]+1,mm=m[2]&&m[2]!=='00'?m[2]:'';return hh+'h'+mm;}
function rot(h){var m=String(h).match(/(\d+):(\d+)/);return m?(+m[1])+'h'+(m[2]!=='00'?m[2]:''):h;}
var NOMES=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var hoje = new Date().getDay();
function desenhar(LISTA){
  var box = document.getElementById('days'); box.innerHTML='';
  LISTA.forEach(function(dia){
    var el = document.createElement('section');
    el.className = 'day' + (dia.d===hoje ? ' today' : '');
    var html = '<div class="dname">'+dia.nome+(dia.d===hoje?'<small>HOJE</small>':'')+'</div><div class="dsub">'+dia.sub+'</div>';
    dia.slots.forEach(function(s){
      var faixa = s[0]+' – '+fim(s[0]);
      if(s[1]){
        html += '<div class="slot busy" aria-label="'+dia.nome+' '+faixa+' ocupado">'+faixa+'<span class="tag">ocupado</span></div>';
      } else {
        var msg = encodeURIComponent('Olá! Quero reservar uma aula de matemática '+(dia.d===6||dia.d===0?'no ':'na ')+dia.nome.toLowerCase()+' das '+faixa+'.');
        html += '<a class="slot" href="https://wa.me/5581982267438?text='+msg+'" target="_blank" rel="noopener" aria-label="Reservar '+dia.nome+' '+faixa+'">'+faixa+'<span class="tag">reservar</span></a>';
      }
    });
    el.innerHTML = html; box.appendChild(el);
  });
}
desenhar(AGENDA);
// Horários ao vivo: vêm da aba "Minha agenda" do professor na plataforma
fetch('https://matematica-fundamental.vercel.app/api/agenda').then(function(r){return r.json();}).then(function(d){
  if(!d||!d.horarios||!d.horarios.length) return;
  var por={}; d.horarios.forEach(function(h){ (por[h.dia]=por[h.dia]||[]).push(h); });
  var LISTA=[1,2,3,4,5,6,0].filter(function(k){return por[k];}).map(function(k){
    var hs=por[k].sort(function(a,b){return a.hora<b.hora?-1:1;});
    var sub=rot(hs[0].hora)+' às '+fim(hs[hs.length-1].hora); if(k===6||k===0) sub=(parseInt(hs[0].hora,10)<12?'manhã · ':'')+sub;
    return {d:k,nome:NOMES[k],sub:sub,slots:hs.map(function(h){return [rot(h.hora),!!h.ocupado];})};
  });
  desenhar(LISTA);
}).catch(function(){});
</script>
</body>
</html>
